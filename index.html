<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked NB Speedrun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importation de Lilita One -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bronze: #cd7f32;
            --dark-bg: #0a0a0c;
            --gold: #FFD700;
        }

        body {
            background-color: var(--dark-bg);
            color: #e2e8f0;
            font-family: 'Lilita One', cursive; /* Police globale */
            background-image: 
                linear-gradient(to bottom, rgba(10, 10, 12, 0.7), rgba(10, 10, 12, 0.85)),
                url('https://media.discordapp.net/attachments/1434252768633290952/1500843171859533886/image.png?ex=69f9e8a0&is=69f89720&hm=7bc7f7d97f2384cd7b6a9d11b38e8366dbb9624d1b7fd7c1a57174333adbc24f&=&format=webp&quality=lossless&width=925&height=423');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .bronze-text {
            color: var(--bronze);
            text-shadow: 0 0 10px rgba(205, 127, 50, 0.3);
        }

        .bronze-card {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(205, 127, 50, 0.2);
        }

        .rank-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1) 0%, transparent 100%);
            border-left: 6px solid var(--gold);
        }

        .world-record-badge {
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            color: #000;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: shine 2s infinite linear, pulse 1.5s infinite;
        }

        @keyframes shine {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
            100% { filter: brightness(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .prissme-footer:hover .neon-text-pink {
            text-shadow: 0 0 12px #ff00ea;
        }

        .neon-text-pink { color: #ff00ea; transition: text-shadow 0.3s; }

        .footer-logo {
            width: 40px;
            height: auto;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-3xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl mb-2 bronze-text uppercase tracking-wide">
                Ranked NB Speedrun
            </h1>
            <p class="text-slate-300 font-bold tracking-tight uppercase drop-shadow-md">Tableau des records mondiaux</p>
        </header>

        <!-- Stats Quick Look -->
        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
            <div class="bronze-card p-4 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase mb-1">Meilleur Temps</p>
                <p id="topTime" class="text-2xl text-emerald-400">--:--.--</p>
            </div>
            <div class="bronze-card p-4 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase mb-1">Catégorie</p>
                <p class="text-sm text-white uppercase tracking-tighter">Bronze 2%</p>
            </div>
        </div>

        <!-- Leaderboard Table -->
        <div class="bronze-card rounded-3xl overflow-hidden shadow-2xl mb-12">
            <table class="w-full text-left">
                <thead class="bg-white/5 border-b border-slate-700 text-[11px] uppercase tracking-widest text-slate-400">
                    <tr>
                        <th class="p-5">#</th>
                        <th class="p-5">Joueur</th>
                        <th class="p-5">Chrono</th>
                        <th class="p-5 text-right">Preuve</th>
                    </tr>
                </thead>
                <tbody id="leaderboard" class="divide-y divide-slate-800/50 text-base md:text-xl">
                    <!-- Contenu dynamique -->
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <footer class="mt-auto py-10 flex flex-col items-center gap-6">
            <div class="prissme-footer text-center group cursor-default">
                <p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-[0.3em]">Propulsé par</p>
                <div class="flex items-center justify-center gap-4 text-3xl">
                    <!-- Image maintenant à côté du nom -->
                    <img src="https://media.discordapp.net/attachments/1434252768633290952/1500845879475703919/9k.png?ex=69f9eb26&is=69f899a6&hm=1ed23494bcda58d42d3abadb07dad32d91a2c93857caaca2bde5b82b28203cf0&=&format=webp&quality=lossless" 
                         alt="Logo Footer" 
                         class="footer-logo">
                    <div class="flex items-center gap-2">
                        <span class="text-white">PRISSME</span>
                        <span class="neon-text-pink">TV</span>
                    </div>
                </div>
            </div>
            <div class="text-[10px] text-slate-400 text-center tracking-widest uppercase bg-black/40 px-6 py-2 rounded-full">
                © 2026 RANKED NB • POWERED BY PRISSME TV
            </div>
        </footer>
    </div>

    <script>
        // --- DONNÉES DU CLASSEMENT ---
        const leaderboardData = [
            { name: "Naell", time: "04:31.00", date: "04/05/2026", proof: "https://youtu.be/n3uWxAc_6nU?si=wa1VXIMiFmiVvcQR" },
            { name: "Prissme", time: "05:16.00", date: "04/05/2026", proof: "https://youtu.be/3EbWp6dwKtA?si=QtmfTchaZYtl0Bz2" },
            { name: "HutaoMarryMe", time: "05:51.00", date: "04/05/2026", proof: "https://youtu.be/_ySJjz6oMSo?si=Tovlgfb5dmjcUh0D" },
            { name: "Pizza", time: "07:00.00", date: "04/05/2026", proof: "#" }
        ];

        function render() {
            const list = document.getElementById('leaderboard');
            
            // Tri par temps (Chrono ascendant)
            const sorted = [...leaderboardData].sort((a, b) => a.time.localeCompare(b.time));
            
            // Mise à jour du meilleur temps affiché
            document.getElementById('topTime').innerText = sorted.length > 0 ? sorted[0].time : "--:--.--";

            list.innerHTML = "";
            
            if (sorted.length === 0) {
                list.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400 italic">Aucun record pour le moment</td></tr>`;
                return;
            }

            sorted.forEach((p, i) => {
                const rank = i + 1;
                const isFirst = rank === 1;
                const tr = document.createElement('tr');
                tr.className = `group hover:bg-white/10 transition-colors ${isFirst ? 'rank-1' : ''}`;
                
                tr.innerHTML = `
                    <td class="p-5 font-bold ${isFirst ? 'text-[var(--gold)]' : 'text-slate-500'}">
                        ${rank.toString().padStart(2, '0')}
                    </td>
                    <td class="p-5">
                        <div class="flex items-center gap-2">
                            <div class="text-white uppercase tracking-tight">${p.name}</div>
                            ${isFirst ? '<span class="world-record-badge">World Record</span>' : ''}
                        </div>
                        <div class="text-[11px] text-slate-400 uppercase italic opacity-75">${p.date}</div>
                    </td>
                    <td class="p-5 font-bold ${isFirst ? 'text-emerald-400 text-2xl' : 'text-slate-300'}">
                        ${p.time}
                    </td>
                    <td class="p-5 text-right">
                        <a href="${p.proof}" target="_blank" class="inline-block text-xs border border-slate-600 bg-black/40 px-4 py-1.5 rounded-lg hover:bg-white hover:text-black transition uppercase tracking-tighter">
                            Clip
                        </a>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        // Rendu initial
        render();
    </script>
</body>
</html>
